name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, estilo, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Analizar estilo
        run: npm run lint

      - name: Comprobar formato
        run: npm run format:check

      - name: Ejecutar pruebas
        run: npm run test

      - name: Construir
        run: npm run build
